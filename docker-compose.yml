services:
  tfh:
    build: .
    container_name: tfh
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - tfh_data:/data          # sqlite + cache de logos
    environment:
      # Comisiones (tanto por uno) usadas para net APR y breakeven. Ajusta a tu tier real.
      FEE_HYPERLIQUID_TAKER: 0.00045
      FEE_HYPERLIQUID_MAKER: 0.00015
      FEE_BACKPACK_TAKER: 0.0005
      FEE_BACKPACK_MAKER: 0.0002
      NET_APR_HORIZON_HOURS: 24
      # Cadencias
      LIVE_REFRESH_SECONDS: 60
      SNAPSHOT_EVERY_SECONDS: 300
      HISTORY_SYNC_SECONDS: 1800
      HISTORY_BACKFILL_DAYS: 31

volumes:
  tfh_data:
